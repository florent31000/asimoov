[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asimoov"
version = "0.1.0"
description = "The open-source soul for companion robots"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Florent Bolzinger" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "websockets>=12.0",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "jsonschema>=4.20",
    "certifi>=2024.2.2",
]

[project.urls]
Homepage = "https://asimoov.com"
Repository = "https://github.com/florent31000/asimoov"

[project.optional-dependencies]
go2 = [
    "aiortc",
    "aioice",
    "av",
    "pylibsrtp",
    "cryptography",
    "pyopenssl",
    "ifaddr",
    "dnspython",
    "requests",
    "packaging",
]
inmoov = [
    "pyserial>=3.5",
]
vision = [
    "onnxruntime",
    "opencv-python-headless",
]
vad = [
    "onnxruntime",
]
# The Claude pipeline: the Messages API plus the local audio ends it needs
# (Kokoro is the only TTS here with a French voice -- see docs/voice.md).
claude = [
    "anthropic>=1.0",
    "faster-whisper>=1.0",
    "kokoro-onnx>=0.4",
]
kivy = [
    "kivy>=2.3",
    "pyjnius",
]
# Microphone and speaker on a laptop or a Raspberry Pi; Android uses its own
# capture/playback and never installs this.
desktop = [
    "sounddevice>=0.4.6",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "jsonschema>=4.20",
    "sounddevice>=0.4.6",
    "anthropic>=1.0",
]

[project.scripts]
asimoov = "asimoov.__main__:main"

[project.entry-points."asimoov.bodies"]
fake = "asimoov.bodies.fake:FakeBody"
avatar = "asimoov.bodies.avatar:AvatarBody"
go2 = "asimoov.bodies.go2:Go2Body"
inmoov = "asimoov.bodies.inmoov:InMoovBody"

[project.entry-points."asimoov.faces"]
web = "asimoov.faces.server:WebFace"
kivy = "asimoov.faces.kivy.renderer:KivyFace"

[project.entry-points."asimoov.voice_providers"]
openai_realtime = "asimoov.voice:OpenAIRealtimeProvider"
claude_pipeline = "asimoov.voice.claude_pipeline:ClaudePipelineProvider"

[project.entry-points."asimoov.perception"]
face_id = "asimoov.perception.face_id:FaceIdModule"
vad = "asimoov.perception.vad_module:VadModule"

[project.entry-points."asimoov.apps"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"asimoov.contracts" = ["schemas/*.json", "examples/*.json", "examples/*.yaml"]
"asimoov.core" = ["behaviors/builtin/*.yaml", "memory/schema.sql"]
"asimoov.bodies.fake" = ["manifest.yaml"]
"asimoov.bodies.avatar" = ["manifest.yaml"]
"asimoov.bodies.go2" = ["manifest.yaml", "vendor/unitree_webrtc_connect/LICENSE"]
"asimoov.bodies.inmoov" = ["gestures/*.yaml"]
"asimoov.faces.web" = ["*.html", "*.css", "*.js", "*.json"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["asimoov"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
