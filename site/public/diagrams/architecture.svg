<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 946 566" width="946" height="566" role="img" aria-labelledby="archTitle archDesc" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="archTitle">How ASIMOOV works</title>
  <desc id="archDesc">Three layers in one process on your machine. The body's senses — camera and microphone — build a picture of the room. The soul holds the scene, the memory and the personality, and decides. The body acts: gestures, gaze and speech. What the body does changes the room, and the senses pick it up again.</desc>

  <rect width="946" height="566" fill="#fbf7f0"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#c86b12"/>
    </marker>
  </defs>

  <g fill="none" stroke="#e6ddcd" stroke-width="1.5">
    <rect x="60" y="36" width="760" height="116" rx="18" fill="#fffdf9"/>
    <rect x="60" y="212" width="760" height="132" rx="18" fill="#fffdf9" stroke="#c86b12" stroke-width="2"/>
    <rect x="60" y="404" width="760" height="116" rx="18" fill="#fffdf9"/>
  </g>

  <g fill="#1f1b16" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="26">
    <text x="92" y="84">Senses</text>
    <text x="92" y="262">Soul</text>
    <text x="92" y="452">Body</text>
  </g>

  <g fill="#776c5d" font-size="14.5">
    <text x="92" y="112">the body's camera and microphone</text>
    <text x="92" y="290">scene, memory, personality, decision</text>
    <text x="92" y="480">gestures, gaze, speech</text>
  </g>

  <g font-size="14" fill="#1f1b16">
    <g fill="#f6ead8" stroke="#e6ddcd" stroke-width="1">
      <rect x="406" y="76" width="106" height="36" rx="18"/>
      <rect x="524" y="76" width="130" height="36" rx="18"/>
      <rect x="666" y="76" width="122" height="36" rx="18"/>
      <rect x="342" y="232" width="98" height="36" rx="18"/>
      <rect x="452" y="232" width="110" height="36" rx="18"/>
      <rect x="574" y="232" width="122" height="36" rx="18"/>
      <rect x="708" y="232" width="80" height="36" rx="18"/>
      <rect x="342" y="284" width="446" height="36" rx="18"/>
      <rect x="406" y="444" width="128" height="36" rx="18"/>
      <rect x="546" y="444" width="128" height="36" rx="18"/>
      <rect x="686" y="444" width="102" height="36" rx="18"/>
    </g>
    <g text-anchor="middle">
      <text x="459" y="99">Camera</text>
      <text x="589" y="99">Microphone</text>
      <text x="727" y="99">Who is here</text>
      <text x="391" y="255">Scene</text>
      <text x="507" y="255">Memory</text>
      <text x="635" y="255">Personality</text>
      <text x="748" y="255">Mind</text>
      <text x="565" y="307">where to look · when to speak first · what to remember</text>
      <text x="470" y="467">wave hello</text>
      <text x="610" y="467">look at Sam</text>
      <text x="737" y="467">speak</text>
    </g>
  </g>

  <g stroke="#c86b12" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M200 152 L200 208"/>
    <path d="M200 344 L200 400"/>
    <path d="M840 470 C 916 470, 916 470, 916 300 C 916 130, 916 130, 842 96"/>
  </g>

  <g fill="#776c5d" font-size="13.5">
    <text x="216" y="187">a picture of the room</text>
    <text x="216" y="379">one request, in human terms</text>
  </g>

  <text transform="rotate(-90 884 283)" x="884" y="283" text-anchor="middle" fill="#776c5d" font-size="13.5">the room changes</text>

  <text x="92" y="548" fill="#776c5d" font-size="13.5">One process. On your machine.</text>
</svg>
